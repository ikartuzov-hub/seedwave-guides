<div class="topctrl">
  <button class="rbtn" id="shareBtn" aria-label="{{SHARELABEL}}">↗</button>
  <button class="rbtn" id="langBtn" aria-label="{{LANGLABEL}}" aria-haspopup="true" aria-expanded="false">{{LANGUPPER}}</button>
  <button class="rbtn" id="themeBtn" aria-label="{{THEMELABEL}}">☾</button>
</div>

{{LANGLINKS}}
</nav>

<div class="wrap">
{{BODY}}
</div>

<footer>
  © <span id="yr"></span> <a href="https://seedwave.pt/">SeedWave</a> · <a href="https://www.linkedin.com/in/igor-kartuzov/" rel="nofollow">Igor Kartuzov</a> · <a href="/igor/">{{IGORANCHOR}}</a>
</footer>

<script>
document.getElementById('yr').textContent=new Date().getFullYear();
var qs=new URLSearchParams(location.search);
// ---- theme ----
var theme=qs.get('theme')||localStorage.getItem('sw_theme')||'dark';
function setTheme(t){document.documentElement.setAttribute('data-theme',t==='light'?'light':'');
  document.getElementById('themeBtn').textContent=t==='light'?'☀':'☾';localStorage.setItem('sw_theme',t);}
setTheme(theme);
document.getElementById('themeBtn').onclick=function(){setTheme(document.documentElement.getAttribute('data-theme')==='light'?'dark':'light');};
// ---- language: each language lives on its own URL ----
localStorage.setItem('sw_lang','{{LANG}}');
var pop=document.getElementById('langPop'),btn=document.getElementById('langBtn');
btn.onclick=function(e){e.stopPropagation();var o=pop.classList.toggle('open');btn.setAttribute('aria-expanded',o);};
document.addEventListener('click',function(){pop.classList.remove('open');btn.setAttribute('aria-expanded',false);});
document.addEventListener('keydown',function(e){if(e.key==='Escape'){pop.classList.remove('open');btn.setAttribute('aria-expanded',false);}});
// ---- одометр: считает вверх до реальной суммы ----
(function(){var el=document.getElementById('odo');if(!el)return;
  var target=parseFloat(el.dataset.v||'0'),loc='{{NUMLOCALE}}',cur=el.dataset.cur||'€';
  function fmt(n){return new Intl.NumberFormat(loc,{maximumFractionDigits:0}).format(Math.round(n))+' '+cur;}
  var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  if(reduce){el.textContent=fmt(target);return;}
  var t0=null,dur=1800;
  function step(ts){if(!t0)t0=ts;var p=Math.min((ts-t0)/dur,1);
    el.textContent=fmt(target*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(step);}
  var seen=false,io=new IntersectionObserver(function(es){es.forEach(function(e){
    if(e.isIntersecting&&!seen){seen=true;requestAnimationFrame(step);}});},{threshold:.4});
  io.observe(el);})();
// ---- дни до ближайшего дедлайна ----
(function(){var els=document.querySelectorAll('.days');if(!els.length)return;
  els.forEach(function(el){var d=Math.ceil((new Date(el.dataset.until)-new Date())/86400000);
    el.textContent=d>0?d:'0';});})();
// ---- переслать другу ----
(function(){var txt={{SHARETEXT}},url=location.origin+location.pathname,done={{SHAREDONE}};
  function go(e){e.preventDefault();
    if(navigator.share){navigator.share({title:document.title,text:txt,url:url}).catch(function(){});return;}
    navigator.clipboard.writeText(txt+' '+url).then(function(){
      var n=document.getElementById('copied');if(n){n.hidden=false;n.textContent=done;setTimeout(function(){n.hidden=true;},2600);}
    }).catch(function(){});}
  ['shareBtn','shareCta'].forEach(function(id){var b=document.getElementById(id);if(b)b.onclick=go;});})();
</script>
